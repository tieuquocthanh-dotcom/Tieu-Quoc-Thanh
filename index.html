    <script>
      // Ghi nhận lỗi console mà không hiển thị banner đỏ che màn hình người dùng
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('Lỗi ứng dụng:', msg, 'tại', url, lineNo, columnNo, error);
        // Ngăn chặn các lỗi nội bộ Firestore assertion không làm gián đoạn trải nghiệm người dùng
        if (typeof msg === 'string' && msg.includes('INTERNAL ASSERTION FAILED')) {
          return true;
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        console.warn('Unhandled promise rejection:', event.reason);
        if (event && event.reason && String(event.reason).includes('INTERNAL ASSERTION FAILED')) {
          event.preventDefault();
        }
      };
    </script>
